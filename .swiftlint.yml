strict: true

included:
  - platforms/macos/App/Sources
  - platforms/macos/Sources
  - platforms/macos/Tests

excluded:
  - platforms/macos/.build

only_rules:
  - array_init
  - closure_body_length
  - closure_parameter_position
  - colon
  - comma
  - compiler_protocol_init
  - control_statement
  - cyclomatic_complexity
  - discouraged_direct_init
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_length
  - force_cast
  - force_try
  - function_body_length
  - function_parameter_count
  - identifier_name
  - implicit_getter
  - implicit_optional_initialization
  - large_tuple
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - legacy_random
  - line_length
  - mark
  - nesting
  - no_fallthrough_only
  - opening_brace
  - operator_usage_whitespace
  - orphaned_doc_comment
  - private_over_fileprivate
  - private_unit_test
  - protocol_property_accessors_order
  - reduce_boolean
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - self_in_property_initialization
  - shorthand_operator
  - sorted_imports
  - statement_position
  - superfluous_disable_command
  - switch_case_alignment
  - syntactic_sugar
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - unneeded_break_in_switch
  - unneeded_override
  - unneeded_parentheses_in_closure_argument
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_function_in_ternary
  - weak_delegate
  - xctfail_message

file_length:
  warning: 1024
  error: 1024

function_body_length:
  warning: 128
  error: 128

closure_body_length:
  warning: 128
  error: 128

type_body_length:
  warning: 512
  error: 512

function_parameter_count:
  warning: 8
  error: 8

cyclomatic_complexity:
  warning: 16
  error: 16

nesting:
  type_level: 8
  function_level: 8

line_length:
  warning: 120
  error: 120
  ignores_comments: false
  ignores_urls: true

identifier_name:
  excluded:
    - ok
