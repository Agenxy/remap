[package]
name = "remap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Map arbitrary hostnames to addresses and routed services"
readme = "../../README.md"
keywords = ["dns", "hostname", "networking", "proxy", "routing"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "remap"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
getrandom.workspace = true
hickory-proto.workspace = true
remap-core = { path = "../remap-core", version = "=0.2.0" }
remap-mcp = { path = "../remap-mcp", version = "=0.2.0" }
remap-network = { path = "../remap-network", version = "=0.2.0" }
remap-protocol = { path = "../remap-protocol", version = "=0.2.0" }
remapd = { path = "../remapd", version = "=0.2.0" }
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
