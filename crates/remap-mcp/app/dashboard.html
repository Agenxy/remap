<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23151714'/%3E%3Ctext x='32' y='44' fill='%23f4f4ef' font-size='40' text-anchor='middle'%3E%E2%86%A6%3C/text%3E%3C/svg%3E">
  <title>Remap</title>
  <style>__REMAP_STYLE__</style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">↦</div>
        <div><div class="eyebrow">Name routing authority</div><div class="title">Remap</div></div>
      </div>
      <button class="button" id="refresh" type="button">Refresh</button>
    </header>
    <div class="notice" id="notice" role="status">Connecting to the local Remap authority…</div>
    <div class="maintenance" id="maintenance" role="alert" hidden></div>
    <section class="stats" aria-label="Registry summary">
      <div class="stat"><span class="eyebrow">Revision</span><b id="revision">—</b></div>
      <div class="stat"><span class="eyebrow">Mappings</span><b id="total">—</b></div>
      <div class="stat"><span class="eyebrow">Active</span><b id="enabled">—</b></div>
    </section>
    <section class="panel outcome" id="outcome" aria-labelledby="outcome-title" hidden>
      <div class="panel-head">
        <h2 id="outcome-title">Latest result</h2><span class="count" id="outcome-kind"></span>
      </div>
      <div class="outcome-body" id="outcome-body"></div>
    </section>
    <section class="panel" aria-labelledby="mapping-title">
      <div class="panel-head">
        <h2 id="mapping-title">Mappings</h2><span class="count" id="count"></span>
      </div>
      <div id="mappings"><div class="empty">Awaiting registry state.</div></div>
    </section>
    <footer>State comes from your private authority. Changes remain revision-checked and idempotent. · panel __REMAP_VERSION__</footer>
  </main>
  <p class="sr" id="announcer" aria-live="polite" aria-atomic="true"></p>
  <script>__REMAP_SCRIPT__</script>
</body>
</html>
