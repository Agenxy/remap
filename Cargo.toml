[workspace]
members = [
    "crates/remap",
    "crates/remap-core",
    "crates/remap-linux",
    "crates/remap-linux-system",
    "crates/remap-mcp",
    "crates/remap-network",
    "crates/remap-protocol",
    "crates/remap-quality",
    "crates/remap-registry",
    "crates/remapd",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/agenxy/remap"
homepage = "https://github.com/agenxy/remap"

[workspace.dependencies]
arc-swap = "=1.9.3"
bytes = "=1.12.1"
blake3 = "=1.8.7"
clap = "=4.6.7"
clap_complete = "=4.6.11"
clap_mangen = "=0.3.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures = "=0.3.34"
getrandom = "=0.4.3"
hmac = { version = "=0.13.0", features = ["zeroize"] }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "http2", "native-tokio", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "server", "tokio"] }
jsonschema = { version = "=0.60.2", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["fs", "net", "signal", "socket", "uio", "user"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
raunch = "=1.0.1"
rmcp = { version = "=3.8.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "limits"] }
rustix = { version = "=1.1.6", features = ["fs", "linux_4_11"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["codec", "rt"] }
tower-service = "=0.3.3"
uuid = { version = "=1.29.0", features = ["serde", "v4"] }
xattr = "=1.7.0"
zeroize = "=1.9.1"
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
rust_2024_compatibility = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
