[workspace]
members = [
    "crates/portal-cli",
    "crates/portal-core",
    "crates/portal-quality",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
clap = "=4.6.6"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = "=1.0.151"
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"
rust_2024_compatibility = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
