[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true
no-default-features = false
exclude-dev = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
allow = []
deny = []
skip = [
    # rmcp 3.1.2 depends on tracing 0.1.44 with its attribute macros enabled;
    # tracing-attributes has not yet migrated to syn 3. Owner: Agenxy Remap
    # maintainers. Expiry: 2026-10-01. Remove this exact exception as soon as
    # that upstream edge converges; the public remediation is the rmcp upgrade.
    { crate = "syn@2.0.119", reason = "official MCP SDK tracing macro edge" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
